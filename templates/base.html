<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HelpDesk{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        nav {
            background: #222;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">HelpDesk</a>
    <a href="{% url 'ticket_list' %}">Tickets</a>
    <a href="{% url 'ticket_create' %}">Create Ticket</a>
    <a href="/admin/">Admin</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
